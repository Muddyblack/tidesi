name: Release

on:
  # Merging a release PR (scripts/tag.sh / make tag) bumps the version in
  # hosts/kde/metadata.json on main. That push is the release: the tag does not exist yet,
  # this workflow creates it together with the GitHub release.
  push:
    branches: [main]
    paths: [hosts/kde/metadata.json]
  workflow_dispatch:

# One release at a time, and never cancel a half-published one.
concurrency:
  group: release
  cancel-in-progress: false

# Read-only unless a job asks for more; only the jobs that publish do.
permissions:
  contents: read

jobs:
  # Reads the version from hosts/kde/metadata.json and works out whether it still needs a
  # release. Pushes that touch the file without bumping the version (or that
  # re-run an already released one) stop here.
  prepare:
    # Forks have no business publishing releases; every later job needs this one.
    if: github.repository == 'Muddyblack/tidesi'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version and whether it is released
        id: v
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          VERSION="$(jq -r .KPlugin.Version hosts/kde/metadata.json)"
          TAG="v${VERSION}"
          NEW=true
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::notice::Releases are only cut from $DEFAULT_BRANCH."
            NEW=false
          elif git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::notice::${TAG} is already released."
            NEW=false
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "new=$NEW"
          } >> "$GITHUB_OUTPUT"

  # The .plasmoid release goes out on its own, so a broken Windows build cannot
  # hold it back; the Windows files are attached to it once they have passed.
  release:
    needs: prepare
    if: needs.prepare.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # make pack compiles the translations (msgfmt) before zipping.
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext

      - name: Build .plasmoid
        run: make pack

      - name: Get version and artifact path
        id: info
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          NAME="$(basename "$PWD")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact=${NAME}-${VERSION}.plasmoid" >> "$GITHUB_OUTPUT"

      # The .mo files are not in git, so a pack that skipped build.sh would ship
      # an English-only widget without failing.
      - name: Check the translations are in the archive
        env:
          ARTIFACT: ${{ steps.info.outputs.artifact }}
        run: unzip -l "$ARTIFACT" | grep -qE 'contents/locale/[^/]+/LC_MESSAGES/[^ ]+\.mo$'

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG="$(git tag --sort=-creatordate | grep -E '^v' | sed -n '1p')"
          if [ -n "$PREV_TAG" ]; then
            NOTES="$(git log "${PREV_TAG}..HEAD" --pretty=format:'- %s' --no-merges)"
          else
            NOTES="$(git log --pretty=format:'- %s' --no-merges)"
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.info.outputs.version }}
          body: |
            ## Changes
            ${{ steps.notes.outputs.notes }}

            ---
            Install by downloading the `.plasmoid` file and running:
            ```
            plasmapkg2 -i ${{ steps.info.outputs.artifact }}
            ```

            **Windows:** run `tideSI-Setup-${{ steps.info.outputs.version }}.exe` (no admin rights needed; it updates an existing install in place). Or unzip `tideSI-windows-${{ steps.info.outputs.version }}.zip` anywhere and run `tideSI.exe`. Either way it lives in the tray.

            Stable Windows builds also include Scoop and WinGet manifests. See the [package manager instructions](https://github.com/Muddyblack/tidesi/blob/main/docs/windows.md#package-managers).

            **macOS:** open `tidesi-macos-${{ steps.info.outputs.version }}-apple-silicon.dmg` (M1 and later) or `tidesi-macos-${{ steps.info.outputs.version }}-intel.dmg` (Intel Macs; Apple menu → About This Mac → Chip/Processor says which) and drag `Tidesi.app` to Applications (ZIPs also available). It lives in the menu bar. If macOS blocks the first launch, use System Settings → Privacy & Security → Open Anyway. See the [macOS install guide](https://github.com/Muddyblack/tidesi/blob/main/docs/macos.md#signing-and-distribution).

            All platform assets are attached a few minutes after the release appears, once their build has passed.
          files: |
            ${{ steps.info.outputs.artifact }}

  # Check the nixpkgs-style packages build for the new release (the tag exists
  # now, so nix-update can fetch it).
  nixpkgs:
    needs: [prepare, release]
    uses: ./.github/workflows/nixpkgs.yml
    with:
      version: ${{ needs.prepare.outputs.tag }}

  # The workflow every push runs — the tests, the build, the built .exe's own
  # selftest, the installer — with the release's version in the file names.
  windows:
    uses: ./.github/workflows/windows.yml
    needs: prepare
    if: needs.prepare.outputs.new == 'true'
    # windows.yml's screenshots-comment job needs these; a reusable workflow's
    # jobs can't be granted more than the caller job passes down, even for a
    # job whose `if:` is never true on a tag push.
    permissions:
      contents: write
      pull-requests: write
    with:
      version: ${{ needs.prepare.outputs.tag }}

  windows-assets:
    needs: [prepare, release, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tidesi-windows

      - name: Attach the Windows build to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            tideSI-windows-*.zip
            tideSI-Setup-*.exe
            dist/package-manifests/tidesi.json
            dist/package-manifests/tidesi-winget-*.zip

  # The COSMIC applet's prebuilt tarball (hosts/cosmic): no Rust toolchain needed.
  cosmic:
    uses: ./.github/workflows/cosmic.yml
    needs: prepare
    if: needs.prepare.outputs.new == 'true'
    with:
      version: ${{ needs.prepare.outputs.tag }}

  cosmic-assets:
    needs: [prepare, release, cosmic]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tidesi-cosmic

      - name: Attach the COSMIC applet to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: tideSI-cosmic-*.tar.gz

  # The workflow every push runs, with the app job's version-stamped ZIP and DMG
  # this time (macos.yml derives its version from hosts/kde/metadata.json,
  # so unlike windows.yml it needs no version input).
  macos:
    uses: ./.github/workflows/macos.yml
    needs: prepare
    if: needs.prepare.outputs.new == 'true'
    # macos.yml's screenshots-comment job needs these; a reusable workflow's
    # jobs can't be granted more than the caller job passes down, even for a
    # job whose `if:` is never true on a tag push.
    permissions:
      contents: write
      pull-requests: write
    # Developer ID signed and notarized once the Apple secrets are set
    # (docs/macos.md#signing-and-distribution); ad-hoc signed until then.
    with:
      notarize: true
    secrets: inherit

  macos-assets:
    needs: [prepare, release, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Both CPU builds (tidesi-macos-apple-silicon, tidesi-macos-intel).
      - uses: actions/download-artifact@v4
        with:
          pattern: tidesi-macos-*
          merge-multiple: true

      - name: Attach the macOS build to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            tidesi-macos-*.zip
            tidesi-macos-*.dmg
