repos:
  - repo: local
    hooks:
      - id: qmlformat
        name: qmlformat
        entry: nix develop --command qmlformat
        args: ["-i"]
        language: system
        files: \.qml$

      - id: qmllint
        name: qmllint
        entry: nix develop --command qmllint
        args: ["-E", "--unresolved-type", "info"]
        language: system
        files: \.qml$

      # CI fails when translate/template.pot or a .po is stale, so regenerate
      # them whenever source that can hold an i18n() string changes. The hook
      # fails once if it rewrote anything: stage the result and commit again.
      - id: i18n-catalogs
        name: i18n catalogs
        entry: nix develop --command ./translate/Messages.sh
        language: system
        pass_filenames: false
        files: \.(qml|js|py|sh)$

      # Regeneration adds empty entries; enforce CI's completeness requirement
      # afterwards, including on commits that only change catalogs or config.
      - id: i18n-complete
        name: i18n catalogs complete
        entry: nix develop --command ./translate/check.sh
        language: system
        pass_filenames: false
        always_run: true
